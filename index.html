<!DOCTYPE html>
<html>
<head>
    <title>My Food</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .food-card {
            width: 250px;
        }

        .food-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>My Food</h1>

    <div class="gallery">

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500" alt="Food 1">
            <h3>Delicious Sandwich</h3>
        </div>

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=500" alt="Food 2">
            <h3>Grilled Steak</h3>
        </div>

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" alt="Food 3">
            <h3>Fresh Salad</h3>
        </div>

        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=500" alt="Food 4">
            <h3>Pasta Special</h3>
        </div>

    </div>

</body>
</html>
